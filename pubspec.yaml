name: career_matrix
description: "Career Matrix - AI-powered career ecosystem for Students, Alumni, Mentors and Companies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  http: ^1.2.2
  http_parser: ^4.0.2
  file_picker: ^11.0.3
  path_provider: ^2.1.4
  syncfusion_flutter_pdfviewer: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/career_matrix_logo.jpg
